<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">24PA — AI Personal Assistant for Feishu and Lark</title>
  <desc id="desc">Self-hosted dsh plugin with sixteen implemented capability cards, agent skills, schedules, calendars, todos, structured memory, review, and operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <clipPath id="shot"><rect x="548" y="88" width="682" height="426" rx="20"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="250" fill="#2563eb" opacity="0.09"/>
  <style>
    text { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .white { fill: #f8fafc; }
    .muted { fill: #a8b6c8; }
    .blue { fill: #7dd3fc; }
    .chip { fill: #e0f2fe; font-size: 16px; font-weight: 650; text-anchor: middle; }
  </style>
  <text x="48" y="42" class="blue" font-size="15" font-weight="700" letter-spacing="1.4">SELF-HOSTED ON DSH</text>
  <text x="48" y="102" class="white" font-size="48" font-weight="750">24PA · 24私助</text>
  <text x="48" y="141" class="blue" font-size="23" font-weight="650">AI Personal Assistant for Feishu / Lark</text>
  <text x="48" y="193" class="white" font-size="28" font-weight="650">One workspace for skills, plans,</text>
  <text x="48" y="230" class="white" font-size="28" font-weight="650">knowledge &amp; follow-through.</text>
  <text x="48" y="273" class="muted" font-size="21">把对话变成可审核、能跟进的行动</text>
  <rect x="48" y="310" width="142" height="40" rx="20" fill="#164e63" stroke="#38bdf8"/>
  <text x="119" y="336" class="chip">Agent Skills</text>
  <rect x="202" y="310" width="126" height="40" rx="20" fill="#172554" stroke="#60a5fa"/>
  <text x="265" y="336" class="chip">Schedules</text>
  <rect x="340" y="310" width="156" height="40" rx="20" fill="#2e1065" stroke="#a78bfa"/>
  <text x="418" y="336" class="chip">Calendar · Todos</text>
  <rect x="48" y="365" width="208" height="52" rx="14" fill="#123c5a" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="152" y="390" class="white" font-size="20" font-weight="750" text-anchor="middle">16 capability cards</text>
  <text x="152" y="409" class="muted" font-size="12" text-anchor="middle">IMPLEMENTED TODAY</text>
  <rect x="270" y="365" width="226" height="52" rx="14" fill="#111827" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text x="383" y="397" class="muted" font-size="17" text-anchor="middle">＋ Future scenario cards</text>
  <text x="48" y="466" class="muted" font-size="17">SQLite by default · PostgreSQL optional</text>
  <text x="48" y="495" class="muted" font-size="17">Feishu · WeCom · QwenNote · Doubao / Melo</text>
  <rect x="538" y="78" width="702" height="446" rx="26" fill="#020617" opacity="0.45"/>
  <image href="24pa-desktop-overview.png" x="548" y="88" width="682" height="426" preserveAspectRatio="xMidYMid slice" clip-path="url(#shot)"/>
  <rect x="548" y="88" width="682" height="426" rx="20" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
  <rect x="32" y="548" width="1216" height="62" rx="16" fill="#0f1d2e" stroke="#334155"/>
  <text x="58" y="575" class="blue" font-size="14" font-weight="700">WORK &amp; PLANS · 5</text>
  <text x="58" y="596" class="muted" font-size="13">Skills · Schedules · Calendar · Todos · Runs</text>
  <text x="476" y="575" class="blue" font-size="14" font-weight="700">KNOWLEDGE · 2</text>
  <text x="476" y="596" class="muted" font-size="13">Review · Memory</text>
  <text x="716" y="575" class="blue" font-size="14" font-weight="700">CONNECTIONS · 6</text>
  <text x="716" y="596" class="muted" font-size="13">Channels · Workspace · Parameters</text>
  <text x="1052" y="575" class="blue" font-size="14" font-weight="700">OPS · 3</text>
  <text x="1052" y="596" class="muted" font-size="13">Health · Budgets · Backups</text>
</svg>
