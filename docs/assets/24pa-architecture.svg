<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">24PA card-based assistant architecture</title>
  <desc id="desc">Local sessions, Feishu, and the desktop workspace share one owner workspace and permission boundary. Assistant coordination and sixteen implemented capability cards use the same 24PA runtime and dsh plugin foundation. Dashed cards represent future extension scenarios.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7a8b99"/></marker>
  </defs>
  <rect width="1600" height="1080" rx="16" fill="#fafaf7" stroke="#e3e1dc"/>
  <style>
    text { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .title { fill: #1f2933; font-size: 34px; font-weight: 650; }
    .subtitle { fill: #667085; font-size: 18px; }
    .entry { fill: #24313d; font-size: 20px; font-weight: 600; text-anchor: middle; }
    .entry-sub { fill: #667085; font-size: 14px; text-anchor: middle; }
    .layer-title { fill: #24313d; font-size: 22px; font-weight: 650; }
    .layer-sub { fill: #52606d; font-size: 16px; }
    .category { font-size: 17px; font-weight: 700; }
    .card { fill: #344054; font-size: 15px; }
    .small { fill: #667085; font-size: 14px; }
    .arrow { stroke: #7a8b99; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .connector { stroke: #7a8b99; stroke-width: 1.6; fill: none; }
  </style>
  <text x="56" y="60" class="title">24PA card-based assistant architecture</text>
  <text x="56" y="94" class="subtitle">24PA is a personal-assistant application built on DeepSeek Harness (DSH)</text>
  <rect x="56" y="112" width="64" height="3" fill="#7c99ac"/>
  <rect x="56" y="130" width="464" height="78" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="288" y="163" class="entry">Local DSH sessions</text><text x="288" y="188" class="entry-sub">Delegate, maintain, and use local tools</text>
  <rect x="568" y="130" width="464" height="78" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="800" y="163" class="entry">Feishu bot</text><text x="800" y="188" class="entry-sub">Business-only conversational entry</text>
  <rect x="1080" y="130" width="464" height="78" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="1312" y="163" class="entry">Desktop workspace</text><text x="1312" y="188" class="entry-sub">Read, configure, review, and operate</text>
  <path d="M288 208 V232 H800 M1312 208 V232 H800" class="connector"/><path d="M800 208 V242" class="arrow"/>
  <rect x="56" y="248" width="1488" height="82" rx="8" fill="#edf2f4" stroke="#9aaebb"/>
  <text x="800" y="280" class="layer-title" text-anchor="middle">24PA workspace + role-based access boundary</text>
  <text x="800" y="309" class="layer-sub" text-anchor="middle">Owner identity · AGENTS.md rules · origin-bound sessions · explicit authorization</text>
  <path d="M800 330 L800 370" class="arrow"/>
  <rect x="56" y="380" width="330" height="390" rx="8" fill="#ffffff" stroke="#c8cdd2"/>
  <text x="80" y="420" class="layer-title">Assistant coordination</text>
  <text x="80" y="456" class="layer-sub">Lead + seven business workers</text>
  <text x="80" y="502" class="card">• Delegation and continuable work</text>
  <text x="80" y="536" class="card">• Results return to their origin</text>
  <text x="80" y="570" class="card">• Explicit owner action authorization</text>
  <text x="80" y="604" class="card">• Role-specific tool allowlists</text>
  <rect x="80" y="650" width="282" height="84" rx="6" fill="#f5f5f2" stroke="#d6d9d6"/>
  <text x="221" y="683" class="entry-sub">One shared assistant preset</text>
  <text x="221" y="710" class="entry-sub">Different permissions by role</text>
  <rect x="410" y="380" width="1134" height="390" rx="8" fill="#ffffff" stroke="#9aaebb"/>
  <text x="434" y="418" class="layer-title">Card-based product surface · 16 implemented cards</text>
  <rect x="430" y="438" width="251" height="266" rx="6" fill="#f3f6f8" stroke="#c5d2dc"/>
  <rect x="430" y="452" width="3" height="20" fill="#7c99ac"/>
  <text x="446" y="467" class="category" fill="#41627a">WORK &amp; PLANS · 5</text>
  <text x="446" y="500" class="card">Skill management</text><text x="446" y="537" class="card">Scheduled tasks</text><text x="446" y="574" class="card">Calendar</text><text x="446" y="611" class="card">Todos</text><text x="446" y="648" class="card">Run history</text>
  <text x="446" y="682" class="small">Plan, execute, and follow through</text>
  <rect x="701" y="438" width="251" height="266" rx="6" fill="#f7f4ee" stroke="#dcd3c2"/>
  <rect x="701" y="452" width="3" height="20" fill="#a49370"/>
  <text x="717" y="467" class="category" fill="#746345">KNOWLEDGE · 2</text>
  <text x="717" y="500" class="card">Handwriting review</text><text x="717" y="537" class="card">Structured memory</text>
  <text x="717" y="682" class="small">Sources, versions, and approval</text>
  <rect x="972" y="438" width="251" height="266" rx="6" fill="#f1f6f3" stroke="#c8d8ce"/>
  <rect x="972" y="452" width="3" height="20" fill="#7f9c89"/>
  <text x="988" y="467" class="category" fill="#4d6e5d">CONNECTIONS · 6</text>
  <text x="988" y="500" class="card">Feishu connection</text><text x="988" y="532" class="card">WeCom connection</text><text x="988" y="564" class="card">QwenNote minutes</text><text x="988" y="596" class="card">Feishu Wiki</text><text x="988" y="628" class="card">Workspace &amp; config</text><text x="988" y="660" class="card">Parameters</text>
  <rect x="1243" y="438" width="251" height="266" rx="6" fill="#f6f4f1" stroke="#d8d2c9"/>
  <rect x="1243" y="452" width="3" height="20" fill="#9a8c7c"/>
  <text x="1259" y="467" class="category" fill="#71665a">OPERATIONS · 3</text>
  <text x="1259" y="500" class="card">Health checks</text><text x="1259" y="537" class="card">Models &amp; budgets</text><text x="1259" y="574" class="card">Ledger &amp; backups</text>
  <text x="1259" y="682" class="small">Evidence before action</text>
  <rect x="430" y="718" width="1064" height="36" rx="6" fill="#fbfbf9" stroke="#98a2ad" stroke-dasharray="7 6"/>
  <text x="962" y="742" class="layer-sub" text-anchor="middle">＋ Future scenario cards — extend the assistant on the same workspace and runtime</text>
  <path d="M800 770 L800 800" class="arrow"/>
  <rect x="56" y="810" width="1488" height="92" rx="8" fill="#edf2f4" stroke="#9aaebb"/>
  <text x="800" y="845" class="layer-title" text-anchor="middle">DeepSeek Harness (DSH) — the application foundation</text>
  <text x="800" y="877" class="layer-sub" text-anchor="middle">24PA assistant preset + host plugin · Cordis · Skills · schedules · work items &amp; runs · inbox/outbox · health &amp; backups</text>
  <path d="M800 902 L800 944" class="arrow"/>
  <rect x="56" y="954" width="464" height="70" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="288" y="985" class="entry">SQLite / PostgreSQL</text><text x="288" y="1008" class="entry-sub">Default local ledger; optional external database</text>
  <rect x="568" y="954" width="464" height="70" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="800" y="985" class="entry">Feishu · WeCom · QwenNote</text><text x="800" y="1008" class="entry-sub">Authorized resources and original platform objects</text>
  <rect x="1080" y="954" width="464" height="70" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="1312" y="985" class="entry">Doubao TTS · Melo</text><text x="1312" y="1008" class="entry-sub">Optional cloud or local voice output</text>
  <text x="1544" y="1056" class="small" text-anchor="end">Solid cards = implemented · Dashed card = extension direction, not a third-party card API</text>
</svg>
