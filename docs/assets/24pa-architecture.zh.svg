<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">24私助卡片化助理架构</title>
  <desc id="desc">本地会话、飞书和电脑端工作区共享同一位主人的工作区与权限边界。助理协调器与十六张已实现的能力卡片共用 24PA 运行时和 dsh 插件底座，虚线卡片代表未来扩展场景。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7a8b99"/></marker>
  </defs>
  <rect width="1600" height="1080" rx="16" fill="#fafaf7" stroke="#e3e1dc"/>
  <style>
    text { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .title { fill: #1f2933; font-size: 34px; font-weight: 650; }
    .subtitle { fill: #667085; font-size: 18px; }
    .entry { fill: #24313d; font-size: 20px; font-weight: 600; text-anchor: middle; }
    .entry-sub { fill: #667085; font-size: 14px; text-anchor: middle; }
    .layer-title { fill: #24313d; font-size: 22px; font-weight: 650; }
    .layer-sub { fill: #52606d; font-size: 16px; }
    .category { font-size: 17px; font-weight: 700; }
    .card { fill: #344054; font-size: 16px; }
    .small { fill: #667085; font-size: 14px; }
    .arrow { stroke: #7a8b99; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .connector { stroke: #7a8b99; stroke-width: 1.6; fill: none; }
  </style>
  <text x="56" y="60" class="title">24私助 · 卡片化个人助理架构</text>
  <text x="56" y="94" class="subtitle">24私助是基于 DeepSeek Harness（DSH）的个人助理应用</text>
  <rect x="56" y="112" width="64" height="3" fill="#7c99ac"/>
  <rect x="56" y="130" width="464" height="78" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="288" y="163" class="entry">本地 DSH 会话</text><text x="288" y="188" class="entry-sub">交办、维护与本地工具</text>
  <rect x="568" y="130" width="464" height="78" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="800" y="163" class="entry">飞书机器人</text><text x="800" y="188" class="entry-sub">业务白名单内的对话入口</text>
  <rect x="1080" y="130" width="464" height="78" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="1312" y="163" class="entry">电脑端工作区</text><text x="1312" y="188" class="entry-sub">查阅、配置、审核与运维</text>
  <path d="M288 208 V232 H800 M1312 208 V232 H800" class="connector"/><path d="M800 208 V242" class="arrow"/>
  <rect x="56" y="248" width="1488" height="82" rx="8" fill="#edf2f4" stroke="#9aaebb"/>
  <text x="800" y="280" class="layer-title" text-anchor="middle">24私助工作区＋按角色分权</text>
  <text x="800" y="309" class="layer-sub" text-anchor="middle">主人身份 · AGENTS.md 规则 · 结果回归发起入口 · 明确授权</text>
  <path d="M800 330 L800 370" class="arrow"/>
  <rect x="56" y="380" width="330" height="390" rx="8" fill="#ffffff" stroke="#c8cdd2"/>
  <text x="80" y="420" class="layer-title">助理协调器</text>
  <text x="80" y="456" class="layer-sub">Lead＋七类业务 Worker</text>
  <text x="80" y="502" class="card">• 可持续的委派与办理</text>
  <text x="80" y="536" class="card">• 结果回到原发起入口</text>
  <text x="80" y="570" class="card">• 行动前主人明确授权</text>
  <text x="80" y="604" class="card">• 按角色裁剪工具白名单</text>
  <rect x="80" y="650" width="282" height="84" rx="6" fill="#f5f5f2" stroke="#d6d9d6"/>
  <text x="221" y="683" class="entry-sub">同一个助理预设</text>
  <text x="221" y="710" class="entry-sub">不同角色拥有不同权限</text>
  <rect x="410" y="380" width="1134" height="390" rx="8" fill="#ffffff" stroke="#9aaebb"/>
  <text x="434" y="418" class="layer-title">卡片化产品能力面 · 16 张已实现卡片</text>
  <rect x="430" y="438" width="251" height="266" rx="6" fill="#f3f6f8" stroke="#c5d2dc"/>
  <rect x="430" y="452" width="3" height="20" fill="#7c99ac"/>
  <text x="446" y="467" class="category" fill="#41627a">事务与计划 · 5</text>
  <text x="446" y="500" class="card">Skill 管理</text><text x="446" y="537" class="card">定时任务</text><text x="446" y="574" class="card">日程</text><text x="446" y="611" class="card">待办</text><text x="446" y="648" class="card">运行记录</text>
  <text x="446" y="682" class="small">从计划到执行与跟进</text>
  <rect x="701" y="438" width="251" height="266" rx="6" fill="#f7f4ee" stroke="#dcd3c2"/>
  <rect x="701" y="452" width="3" height="20" fill="#a49370"/>
  <text x="717" y="467" class="category" fill="#746345">知识与资料 · 2</text>
  <text x="717" y="500" class="card">手写审核</text><text x="717" y="537" class="card">结构化记忆</text>
  <text x="717" y="682" class="small">来源、版本与人工确认</text>
  <rect x="972" y="438" width="251" height="266" rx="6" fill="#f1f6f3" stroke="#c8d8ce"/>
  <rect x="972" y="452" width="3" height="20" fill="#7f9c89"/>
  <text x="988" y="467" class="category" fill="#4d6e5d">接入与设置 · 6</text>
  <text x="988" y="500" class="card">飞书接入</text><text x="988" y="532" class="card">企业微信接入</text><text x="988" y="564" class="card">QwenNote 听记</text><text x="988" y="596" class="card">飞书知识库</text><text x="988" y="628" class="card">工作区与配置</text><text x="988" y="660" class="card">参数配置</text>
  <rect x="1243" y="438" width="251" height="266" rx="6" fill="#f6f4f1" stroke="#d8d2c9"/>
  <rect x="1243" y="452" width="3" height="20" fill="#9a8c7c"/>
  <text x="1259" y="467" class="category" fill="#71665a">运行与维护 · 3</text>
  <text x="1259" y="500" class="card">全应用健康检查</text><text x="1259" y="537" class="card">模型与预算</text><text x="1259" y="574" class="card">账本与备份</text>
  <text x="1259" y="682" class="small">先看证据，再执行操作</text>
  <rect x="430" y="718" width="1064" height="36" rx="6" fill="#fbfbf9" stroke="#98a2ad" stroke-dasharray="7 6"/>
  <text x="962" y="742" class="layer-sub" text-anchor="middle">＋ 未来新场景卡片 · 在同一工作区与运行时上扩展个人助理能力</text>
  <path d="M800 770 L800 800" class="arrow"/>
  <rect x="56" y="810" width="1488" height="92" rx="8" fill="#edf2f4" stroke="#9aaebb"/>
  <text x="800" y="845" class="layer-title" text-anchor="middle">DeepSeek Harness（DSH）· 应用底座</text>
  <text x="800" y="877" class="layer-sub" text-anchor="middle">24PA 助理预设＋宿主插件 · Cordis · Skill · 计划 · 交办与运行 · Inbox／Outbox · 健康与备份</text>
  <path d="M800 902 L800 944" class="arrow"/>
  <rect x="56" y="954" width="464" height="70" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="288" y="985" class="entry">SQLite / PostgreSQL</text><text x="288" y="1008" class="entry-sub">默认本地账本，可选外部数据库</text>
  <rect x="568" y="954" width="464" height="70" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="800" y="985" class="entry">飞书 · 企微 · QwenNote</text><text x="800" y="1008" class="entry-sub">授权资源与原平台对象</text>
  <rect x="1080" y="954" width="464" height="70" rx="8" fill="#ffffff" stroke="#d6d9d6"/>
  <text x="1312" y="985" class="entry">豆包 TTS · Melo</text><text x="1312" y="1008" class="entry-sub">可选云端或本地语音输出</text>
  <text x="1544" y="1056" class="small" text-anchor="end">实线卡片＝已实现 · 虚线卡片＝扩展方向，不代表现有第三方卡片 API</text>
</svg>
